<!doctype html>

<script>
/* 3D auta (stejný kód jako v aplikaci) */
try {
/* RC-90 3D auta – procedurální modely (three.js r160) */
// ===== cars.js
// RC-90 – 3D siluety aut (procedurální model + polep jako textura)
const T = window.THREE;

// ---------------------------------------------------------------- pomocné
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function curve(pts, s) {           // po částech – mix lineární a kosinové interpolace
  if (s <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    const [s1, z1] = pts[i], [s0, z0] = pts[i - 1];
    if (s <= s1) {
      const t = (s - s0) / (s1 - s0);
      const e = 0.55 * t + 0.45 * (1 - Math.cos(Math.PI * t)) / 2;
      return z0 + (z1 - z0) * e;
    }
  }
  return pts[pts.length - 1][1];
}

// ---------------------------------------------------------------- převod z metrů
function normalize(c) {
  if (!c.abs || c._n) return c;
  const L = c.L, f = x => x / L;
  c.belt = c.belt.map(([x, z]) => [f(x), z]);
  for (const k of ['cowl', 'rf', 'rr', 'deck', 'c0', 'c1', 'seat', 'ws0', 'ws1', 'mirror']) if (c.cab[k] != null) c.cab[k] = f(c.cab[k]);
  if (c.cab.side) c.cab.side = c.cab.side.map(([a, b]) => [f(a), f(b)]);
  if (c.wing) { c.wing.s = f(c.wing.s); if (c.wing.lower) c.wing.lower.s = f(c.wing.lower.s); }
  c.axF = c.ohF / L; c.axR = (c.ohF + c.WB) / L;
  c.track = c.track || (c.tf + c.tr) / 2;
  c.H = c.cab.roofH || c.H;
  c._n = 1; return c;
}

// ---------------------------------------------------------------- tvar karoserie
function makeShape(c) {
  const L = c.L, hw = c.W / 2;
  const gc0 = c.gc;
  const belt = s => curve(c.belt, s);
  const width = s => {
    const u = 2 * s - 1;                      // -1 předek, +1 záď
    const p = u < 0 ? c.pF : c.pR;
    let w = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(u), p)), 1 / p);
    if (s < 0.35) w *= 1 - c.noseTaper * Math.pow(1 - s / 0.35, 2);
    if (s > 0.75) w *= 1 - (c.tailTaper || 0) * Math.pow((s - 0.75) / 0.25, 2);
    return hw * w;
  };
  const cab = c.cab;
  const roof = s => {
    const b = belt(s);
    if (cab.open) {
      if (s < cab.c0 || s > cab.c1) return b;
      const r = 0.02;
      const k = Math.min(clamp((s - cab.c0) / r, 0, 1), clamp((cab.c1 - s) / r, 0, 1));
      return b - cab.tub * k;
    }
    if (s <= cab.cowl || s >= cab.deck) return b;
    const crown = (z, s0, s1) => z + 0.012 * Math.sin(Math.PI * clamp((s - s0) / (s1 - s0), 0, 1));
    if (s < cab.rf) {
      const t = (s - cab.cowl) / (cab.rf - cab.cowl);
      const e = t + (cab.wsBow || 0.10) * Math.sin(Math.PI * t);   // lehce vypouklé čelní sklo
      return belt(cab.cowl) + (cab.roofH - belt(cab.cowl)) * clamp(e, 0, 1);
    }
    if (s <= cab.rr) return crown(cab.roofH, cab.rf, cab.rr);
    const t = (s - cab.rr) / (cab.deck - cab.rr);
    const e = t - (cab.rsBow || 0.08) * Math.sin(Math.PI * t);
    return cab.roofH + (belt(cab.deck) - cab.roofH) * clamp(e, 0, 1);
  };
  // podběhy kol
  const gcAt = s => {
    let g = gc0;
    for (const ax of [c.axF, c.axR]) {
      const dx = (s - ax) * L, a = c.R + 0.075;
      if (Math.abs(dx) < a) g = Math.max(g, gc0 + (2 * c.R + 0.045 - gc0) * Math.sqrt(1 - (dx / a) ** 2));
    }
    return g;
  };
  let bMax = 0; for (let i = 0; i <= 200; i++) bMax = Math.max(bMax, belt(i / 200));
  const flare = (s, z) => {
    if (!c.flare) return 0;
    let k = 0;
    for (const ax of [c.axF, c.axR]) { const dx = Math.abs((s - ax) * L), a = c.R + 0.26; if (dx < a) k = Math.max(k, 0.5 + 0.5 * Math.cos(Math.PI * dx / a)); }
    return c.flare * k * clamp((2 * c.R + 0.16 - z) / 0.12, 0, 1);
  };
  return { L, hw, belt, width, roof, gcAt, gc0, bMax, flare, X: s => L / 2 - s * L };
}

function ring(sh, c, s) {
  const w = Math.max(sh.width(s), 0.0005);
  const g = sh.gcAt(s), b = sh.belt(s), r = sh.roof(s);
  const pts = [];
  const vSide = z => clamp(0.08 + 0.22 * (z - sh.gc0) / (sh.bMax - sh.gc0), 0.08, 0.30);
  const push = (y, z, v) => pts.push([y, z, v]);
  const rb = Math.min(0.07, (b - g) * 0.3, w * 0.5);
  const rt = Math.min(Math.min(c.shoulder || 0.07, 0.045), (b - g) * 0.35, w * 0.45);
  // A spodek
  push(0, g, 0); push((w - rb) / 2, g, 0.02); push(w - rb, g, 0.04);
  // B spodní hrana
  for (let k = 1; k <= 3; k++) { const a = -Math.PI / 2 + k * Math.PI / 6; const z = g + rb + rb * Math.sin(a); push(w - rb + rb * Math.cos(a) + sh.flare(s, z), z, 0.04 + 0.04 * k / 3); }
  // C bok (lehce vypouklý)
  const z0 = g + rb, z1 = b - rt;
  for (let k = 1; k <= 6; k++) { const t = k / 6, z = z0 + (z1 - z0) * t; push(w + (c.bulge || 0.012) * Math.sin(Math.PI * t) * (w / sh.hw) + sh.flare(s, z), z, vSide(z)); }
  // D rameno
  for (let k = 1; k <= 3; k++) { const a = k * Math.PI / 6; push(w - rt + rt * Math.cos(a), b - rt + rt * Math.sin(a), 0.30 + 0.06 * k / 3); }
  // E boční okna / stěna kokpitu
  const wb = w - rt;
  const d = r >= b ? 1 : -1;
  const rr = Math.min(0.065, Math.abs(r - b) * 0.45, wb * 0.3);
  const wt = c.cab.open && r < b ? Math.max(wb - 0.07, 0) : wb * (1 - (1 - (c.tumble || 0.8)) * clamp(Math.abs(r - b) / 0.35, 0, 1));
  for (let k = 1; k <= 3; k++) { const t = k / 3; push(wb + (wt - wb) * t, b + (r - d * rr - b) * t, 0.36 + 0.08 * t); }
  // F horní hrana
  for (let k = 1; k <= 3; k++) { const a = k * Math.PI / 6; push(wt - rr + rr * Math.cos(a), r - d * rr + d * rr * Math.sin(a), 0.44 + 0.03 * k / 3); }
  // G střed střechy / kapoty (absolutní příčná souřadnice)
  const yG = sh.hw * 0.9;
  const y0 = Math.max(wt - rr, 0);
  for (let k = 1; k <= 3; k++) { const y = y0 * (1 - k / 3); push(y, r, k === 3 ? 0.5 : clamp(0.5 - 0.03 * y / yG, 0.47, 0.5)); }
  return pts;
}

function bodyGeometry(sh, c) {
  const N = 240;
  const ss = [];
  for (let i = 0; i < N; i++) { const t = i / (N - 1); ss.push(0.45 * t + 0.55 * (1 - Math.cos(Math.PI * t)) / 2); }
  const pos = [], uv = [], idx = [];
  let M = 0;
  for (const s of ss) {
    const half = ring(sh, c, s);
    const full = half.map(([y, z, v]) => [y, z, v]);
    for (let k = half.length - 2; k >= 0; k--) { const [y, z, v] = half[k]; full.push([-y, z, 1 - v]); }
    M = full.length;
    const x = sh.X(s);
    for (const [y, z, v] of full) { pos.push(x, z, y); uv.push(s, v); }
  }
  for (let i = 0; i < N - 1; i++) for (let j = 0; j < M - 1; j++) {
    const a = i * M + j, b = (i + 1) * M + j, cc = (i + 1) * M + j + 1, d = i * M + j + 1;
    idx.push(a, d, b, b, d, cc);
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const n = g.attributes.normal;
  for (let i = 0; i < n.count; i++) if (!isFinite(n.getX(i)) || (n.getX(i) === 0 && n.getY(i) === 0 && n.getZ(i) === 0)) n.setXYZ(i, 0, 1, 0);
  return g;
}

// ---------------------------------------------------------------- polep (textura)
let TW = window.RC90_TEX || 4096, TH = TW / 2;
function painter(c, sh, liv) {
  const cv = document.createElement('canvas'); cv.width = TW; cv.height = TH;
  const x = cv.getContext('2d');
  const rc = document.createElement('canvas'); rc.width = 512; rc.height = 256;
  const rx = rc.getContext('2d');
  const base = () => x.setTransform(TW, 0, 0, -TH, 0, TH);   // souřadnice (s, v)
  base(); rx.setTransform(512, 0, 0, -256, 0, 256);
  const L = sh.L;
  const kv = 0.22 / (sh.bMax - sh.gc0);   // v na metr na boku
  const yG = sh.hw * 0.9, kt = 0.03 / yG; // v na metr nahoře
  const vS = h => 0.08 + 0.22 * h;        // h = poměrná výška boku 0..1
  const zH = z => (z - sh.gc0) / (sh.bMax - sh.gc0);
  const P = {
    c, sh, x,
    h: zH,
    fill(col) { x.fillStyle = col; x.fillRect(0, 0.04, 1, 0.92); },
    // obdélník na obou bocích (s0..s1, výška h0..h1)
    side(s0, s1, h0, h1, col) {
      x.fillStyle = col;
      x.fillRect(s0, vS(h0), s1 - s0, vS(h1) - vS(h0));
      x.fillRect(s0, 1 - vS(h1), s1 - s0, vS(h1) - vS(h0));
    },
    // mnohoúhelník na obou bocích, body [s, h]
    sidePoly(pts, col) {
      x.fillStyle = col;
      for (const m of [0, 1]) {
        x.beginPath();
        pts.forEach(([s, h], i) => { const v = m ? 1 - vS(h) : vS(h); i ? x.lineTo(s, v) : x.moveTo(s, v); });
        x.closePath(); x.fill();
      }
    },
    // horní plocha (kapota / střecha / víko): body [s, f], f = příčná poloha 0 střed .. 1 okraj středového pole
    topPoly(pts, col) {
      x.fillStyle = col;
      for (const m of [0, 1]) {
        x.beginPath();
        pts.forEach(([s, f], i) => { const v = 0.5 + (m ? 1 : -1) * 0.03 * Math.min(f, 1); i ? x.lineTo(s, v) : x.moveTo(s, v); });
        x.closePath(); x.fill();
      }
    },
    topFull(s0, s1, col) { x.fillStyle = col; x.fillRect(s0, 0.30, s1 - s0, 0.40); },
    // pruh přes ramena a horní plochu (f 0..1 střed, 1..2 = rameno)
    topBand(s0, s1, f0, f1, col) { P.topPoly([[s0, f0], [s1, f0], [s1, f1], [s0, f1]], col); },
    // text na bocích – výška a s v metrech, čitelný z obou stran
    sideText(txt, sC, h, sizeM, col, opt = {}) {
      for (const right of [false, true]) {
        base();
        const v0 = right ? 1 - vS(h) : vS(h);
        // levý bok (z+): čteno směrem dozadu (−s), nahoru = +v
        if (!right) x.transform(-1 / L, 0, 0, -kv, sC, v0);
        else x.transform(1 / L, 0, 0, kv, sC, v0);
        drawText(x, txt, sizeM, col, opt);
      }
      base();
    },
    // text nahoře, čitelný zepředu
    topText(txt, sC, sizeM, col, opt = {}) {
      base();
      x.transform(0, kt, -1 / L, 0, sC, 0.5);
      drawText(x, txt, sizeM, col, opt);
      base();
    },
    // startovní číslo na dveřích
    doorNumber(sC, h, num, opt = {}) {
      const r = opt.r || 0.17;
      for (const right of [false, true]) {
        base();
        const v0 = right ? 1 - vS(h) : vS(h);
        if (!right) x.transform(-1 / L, 0, 0, -kv, sC, v0); else x.transform(1 / L, 0, 0, kv, sC, v0);
        x.fillStyle = opt.bg || '#FFFFFF';
        roundRect(x, -r * 1.1, -r, r * 2.2, r * 2, r * 0.25); x.fill();
        if (opt.ring) { x.lineWidth = 0.025; x.strokeStyle = opt.ring; x.stroke(); }
        drawText(x, String(liv.numberOverride || num), r * 1.35, opt.fg || '#111', { dy: r * 0.02 });
      }
      base();
    },
    roofNumber(sC, num, opt = {}) {
      const r = opt.r || 0.22;
      base();
      x.transform(0, kt, -1 / L, 0, sC, 0.5);
      x.fillStyle = opt.bg || '#FFFFFF';
      x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.fill();
      if (opt.ring) { x.lineWidth = 0.03; x.strokeStyle = opt.ring; x.stroke(); }
      drawText(x, String(liv.numberOverride || num), r * 1.15, opt.fg || '#111', { dy: r * 0.02 });
      base();
    },
    topOval(sC, rw, rh, col, txt, tcol) {
      base(); x.transform(0, kt, -1 / L, 0, sC, 0.5);
      x.fillStyle = col; x.beginPath(); x.ellipse(0, 0, rw, rh, 0, 0, Math.PI * 2); x.fill();
      x.lineWidth = 0.02; x.strokeStyle = '#fff'; x.stroke();
      if (txt) drawText(x, txt, rh * 1.3, tcol || '#fff', { italic: 1 });
      base();
    },
    sideOval(sC, h, rw, rh, col, txt, tcol) {
      for (const right of [false, true]) {
        base(); const v0 = right ? 1 - vS(h) : vS(h);
        if (!right) x.transform(-1 / L, 0, 0, -kv, sC, v0); else x.transform(1 / L, 0, 0, kv, sC, v0);
        x.fillStyle = col; x.beginPath(); x.ellipse(0, 0, rw, rh, 0, 0, Math.PI * 2); x.fill();
        x.lineWidth = 0.015; x.strokeStyle = '#fff'; x.stroke();
        if (txt) drawText(x, txt, rh * 1.25, tcol || '#fff', { italic: 1 });
      }
      base();
    },
    roughRect(s0, s1, v0, v1, val) { rx.fillStyle = `rgb(${val},${val},${val})`; rx.fillRect(s0, v0, s1 - s0, v1 - v0); rx.fillRect(s0, 1 - v1, s1 - s0, v1 - v0); },
    matteTop(s0, s1) { P.roughRect(s0, s1, 0.30, 0.5, 215); },
  };
  // podklad
  rx.fillStyle = 'rgb(95,95,95)'; rx.fillRect(0, 0, 1, 1);
  x.fillStyle = liv.body; x.fillRect(0, 0, 1, 1);
  liv.paint && liv.paint(P);
  // spodek + podběhy tmavé
  x.fillStyle = '#1b1c1f'; x.fillRect(0, 0, 1, 0.045); x.fillRect(0, 0.955, 1, 0.045);
  paintGlass(P, liv);
  liv.after && liv.after(P);
  return { map: cv, rough: rc };
}

function roundRect(x, X, Y, w, h, r) {
  x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r);
  x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath();
}
function drawText(x, txt, sizeM, col, opt) {
  x.save();
  // canvas text: velikost v px → škálovat do metrů
  const px = 200;
  x.scale(sizeM / px, sizeM / px);
  x.font = `${opt.weight || 700} ${px}px ${opt.font || "Barlow, 'Barlow Condensed', 'Arial Narrow', sans-serif"}`;
  x.textAlign = opt.align || 'center'; x.textBaseline = 'middle';
  if (opt.italic) x.transform(1, 0, -0.22, 1, 0, 0);
  if (opt.stretch) x.scale(opt.stretch, 1);
  const dy = (opt.dy || 0) * px / sizeM;
  if (opt.stroke) { x.lineJoin = 'round'; x.lineWidth = opt.strokeW || 22; x.strokeStyle = opt.stroke; x.strokeText(txt, 0, dy + px * 0.06); }
  x.fillStyle = col; x.fillText(txt, 0, dy + px * 0.06);
  x.restore();
}

function paintGlass(P, liv) {
  const { c, x } = P, cab = c.cab;
  const glass = '#11161c';
  const g = (s0, s1, v0, v1) => { x.fillStyle = glass; x.fillRect(s0, v0, s1 - s0, v1 - v0); x.fillRect(s0, 1 - v1, s1 - s0, v1 - v0); P.roughRect(s0, s1, v0, v1, 12); };
  if (cab.open) {
    // vnitřek kokpitu
    x.fillStyle = '#2a2a2c'; x.fillRect(cab.c0, 0.36, cab.c1 - cab.c0, 0.28);
    P.roughRect(cab.c0, cab.c1, 0.36, 0.5, 200);
    return;
  }
  const trim = (s0, s1, v0, v1) => { x.fillStyle = '#17181a'; x.fillRect(s0, v0, s1 - s0, v1 - v0); x.fillRect(s0, 1 - v1, s1 - s0, v1 - v0); };
  if (!liv.chromeTrim) for (const [s0, s1] of cab.side) trim(s0 - 0.006, s1 + 0.006, 0.362, 0.441);
  for (const [s0, s1] of cab.side) g(s0, s1, 0.367, 0.436);
  g(cab.cowl + 0.006, cab.rf - 0.004, 0.446, 0.5);
  g(cab.rr + 0.006, cab.deck - 0.008, 0.446, 0.5);
  // sluneční clona s nápisem
  if (liv.sun) {
    const s1 = cab.rf - 0.004, s0 = s1 - 0.028 * 4.4 / c.L;
    x.fillStyle = liv.sun.bg; x.fillRect(s0, 0.446, s1 - s0, 0.108);
    P.topText(liv.sun.text || 'RC-90', (s0 + s1) / 2, 0.085, liv.sun.fg, { weight: 700, stretch: 1.2 });
  }
}

// ---------------------------------------------------------------- díly
function mat(col, o = {}) {
  return new T.MeshPhysicalMaterial(Object.assign({ color: col, roughness: 0.45, metalness: 0, clearcoat: 0.4, clearcoatRoughness: 0.2 }, o));
}
function frontX(sh, y, rear) {
  y = Math.abs(y);
  let lo = 0, hi = 0.5;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (sh.width(m) >= y) hi = m; else lo = m; }
  const s0 = rear ? 1 - hi : hi;
  if (rear) { lo = 0.5; hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (sh.width(m) >= y) lo = m; else hi = m; } return { x: sh.X(lo), s: lo }; }
  return { x: sh.X(s0), s: s0 };
}
// plocha přiložená k čelu/zádi, sleduje půdorys (světla, maska)
function faceStrip(sh, rear, ya, yb, z0, z1, off, material, round = 0.012) {
  const n = 24, pts = [];
  for (let i = 0; i <= n; i++) { const y = ya + (yb - ya) * i / n; pts.push([frontX(sh, y, rear).x, y]); }
  const pos = [], idx = [];
  const e = Math.min(round, (z1 - z0) / 3);
  const prof = [[-0.03, z0], [off - 0.004, z0], [off, z0 + e], [off, z1 - e], [off - 0.004, z1], [-0.03, z1]];
  const dir = rear ? -1 : 1;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, pts.length - 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    let nx = ty, ny = -tx; if (nx * dir < 0) { nx = -nx; ny = -ny; }
    const [px, py] = pts[i];
    for (const [o, z] of prof) pos.push(px + nx * o, z, py + ny * o);
  }
  const m = prof.length;
  for (let i = 0; i < pts.length - 1; i++) for (let j = 0; j < m - 1; j++) {
    const A = i * m + j, B = (i + 1) * m + j, C = (i + 1) * m + j + 1, D = i * m + j + 1;
    idx.push(A, B, D, B, C, D);
  }
  // čela (boky pásu)
  for (const i of [0, pts.length - 1]) { const b0 = i * m; idx.push(b0, b0 + 1, b0 + 4, b0 + 1, b0 + 2, b0 + 4, b0 + 2, b0 + 3, b0 + 4, b0, b0 + 4, b0 + 5); }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const mesh = new T.Mesh(g, material); material.side = T.DoubleSide; return mesh;
}
// pás kolem čela/zádě (nárazník apod.) – sleduje půdorys
function outlineStrip(sh, sMax, z0, z1, off, material, rear = false, depth = 0.06) {
  const pts = [];
  const n = 40;
  for (let i = n; i >= 0; i--) { const s = sMax * i / n; pts.push([rear ? 1 - s : s, 1]); }
  for (let i = 1; i <= n; i++) { const s = sMax * i / n; pts.push([rear ? 1 - s : s, -1]); }
  const P2 = pts.map(([s, sg]) => [sh.X(s), sg * sh.width(s)]);
  const pos = [], idx = [];
  const prof = [[-depth, z0], [off, z0 + 0.012], [off, z1 - 0.012], [-depth, z1]];  // [offset, z]
  for (let i = 0; i < P2.length; i++) {
    const a = P2[Math.max(i - 1, 0)], b = P2[Math.min(i + 1, P2.length - 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    let nx = ty, ny = -tx;                       // normála ven
    const mid = P2[i];
    if ((mid[0] * nx + mid[1] * ny) < 0) { nx = -nx; ny = -ny; }
    for (const [o, z] of prof) pos.push(mid[0] + nx * o, z, mid[1] + ny * o);
  }
  const m = prof.length;
  for (let i = 0; i < P2.length - 1; i++) for (let j = 0; j < m - 1; j++) {
    const a = i * m + j, b = (i + 1) * m + j, cc = (i + 1) * m + j + 1, d = i * m + j + 1;
    idx.push(a, b, d, b, cc, d);
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const mesh = new T.Mesh(g, material); mesh.material.side = T.DoubleSide; return mesh;
}
function rbox(w, h, d, r, material) {   // zaoblený kvádr (jednoduše: box + malé zkosení přes segmenty)
  const shape = new T.Shape();
  const x = -w / 2, y = -h / 2;
  r = Math.min(r, w / 2, h / 2);
  shape.moveTo(x + r, y); shape.lineTo(x + w - r, y); shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + h - r); shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  shape.lineTo(x + r, y + h); shape.quadraticCurveTo(x, y + h, x, y + h - r);
  shape.lineTo(x, y + r); shape.quadraticCurveTo(x, y, x + r, y);
  const g = new T.ExtrudeGeometry(shape, { depth: d, bevelEnabled: true, bevelThickness: Math.min(0.01, d / 3), bevelSize: Math.min(0.01, r), bevelSegments: 3, curveSegments: 6 });
  g.translate(0, 0, -d / 2);
  return new T.Mesh(g, material);
}

// lampa na čele (shape 'rect' | 'round' | 'quad' | 'round2')
function lamp(group, sh, o, rear) {
  const glow = rear ? 0xd0101a : 0xfff6d8;
  const lens = mat(rear ? 0xb5121b : 0xdfe6ee, { emissive: glow, emissiveIntensity: rear ? 0.3 : 0.25, roughness: 0.08, metalness: 0.3, clearcoat: 1 });
  const rim = mat(0x111111, { roughness: 0.5 });
  const amberM = mat(0xf0a020, { emissive: 0xf09000, emissiveIntensity: 0.3, roughness: 0.1, clearcoat: 1 });
  for (const sg of [1, -1]) {
    const yc = sg * o.y;
    const fx = frontX(sh, Math.abs(yc) + (o.shape === 'round' ? o.r : (o.w || 0.1) * 0.5) * 0.35, rear);
    const dir = rear ? -1 : 1;
    if (o.shape === 'round') {
      const ring = new T.Mesh(new T.CylinderGeometry(o.r + 0.012, o.r + 0.012, 0.04, 28), rim);
      ring.rotation.z = Math.PI / 2; ring.position.set(fx.x - dir * 0.012, o.z, yc); group.add(ring);
      const l = new T.Mesh(new T.CylinderGeometry(o.r, o.r, 0.045, 28), lens);
      l.rotation.z = Math.PI / 2; l.position.set(fx.x - dir * 0.006, o.z, yc); group.add(l);
    } else {
      const ya = sg * (o.y - o.w / 2), yb = sg * (o.y + o.w / 2);
      group.add(faceStrip(sh, rear, ya - sg * 0.018, yb + sg * 0.018, o.z - o.h / 2 - 0.018, o.z + o.h / 2 + 0.018, 0.008, rim, 0.02));
      group.add(faceStrip(sh, rear, ya, yb, o.z - o.h / 2, o.z + o.h / 2, 0.016, o.amber ? amberM : lens, Math.min(o.h, o.w) * (o.round ?? 0.2)));
    }
  }
}

function rimTexture(style, col) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const x = cv.getContext('2d');
  x.translate(128, 128);
  x.fillStyle = '#151515'; x.beginPath(); x.arc(0, 0, 128, 0, 7); x.fill();
  x.fillStyle = col; x.beginPath(); x.arc(0, 0, 120, 0, 7); x.fill();
  x.fillStyle = 'rgba(0,0,0,0.75)';
  const n = style === 'star' ? 5 : style === 'multi' ? 8 : style === 'dish' ? 0 : 6;
  if (style === 'mesh') {
    x.fillStyle = 'rgba(0,0,0,0.78)'; x.beginPath(); x.arc(0, 0, 106, 0, 7); x.fill();
    x.strokeStyle = col; x.lineWidth = 7;
    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; x.beginPath(); x.moveTo(Math.cos(a) * 30, Math.sin(a) * 30); x.lineTo(Math.cos(a + 0.55) * 106, Math.sin(a + 0.55) * 106); x.stroke(); x.beginPath(); x.moveTo(Math.cos(a) * 30, Math.sin(a) * 30); x.lineTo(Math.cos(a - 0.55) * 106, Math.sin(a - 0.55) * 106); x.stroke(); }
    x.lineWidth = 5; x.beginPath(); x.arc(0, 0, 70, 0, 7); x.stroke();
    x.fillStyle = 'rgba(255,255,255,0.0)';
  } else if (style === 'dish') {
    x.fillStyle = 'rgba(0,0,0,0.25)'; x.beginPath(); x.arc(0, 0, 100, 0, 7); x.fill();
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + 0.6; x.fillStyle = '#222'; x.beginPath(); x.ellipse(Math.cos(a) * 72, Math.sin(a) * 72, 18, 14, a, 0, 7); x.fill(); }
  } else {
    x.fillStyle = 'rgba(0,0,0,0.80)';
    for (let i = 0; i < n; i++) {
      const a = i * 2 * Math.PI / n + Math.PI / n;
      x.save(); x.rotate(a);
      if (n === 5) { x.beginPath(); x.moveTo(42, 0); x.quadraticCurveTo(70, -36, 104, -30); x.arc(0, 0, 104, -0.29, 0.29); x.quadraticCurveTo(70, 36, 42, 0); x.closePath(); x.fill(); }
      else { x.beginPath(); x.moveTo(40, -7); x.lineTo(104, -18); x.arc(0, 0, 104, -0.17, 0.17); x.lineTo(40, 7); x.closePath(); x.fill(); }
      x.restore();
    }
  }
  x.fillStyle = 'rgba(255,255,255,0.18)'; x.beginPath(); x.arc(0, 0, 120, Math.PI * 1.1, Math.PI * 1.6); x.arc(0, 0, 112, Math.PI * 1.6, Math.PI * 1.1, true); x.fill();
  x.fillStyle = '#333'; x.beginPath(); x.arc(0, 0, 30, 0, 7); x.fill();
  x.fillStyle = col; x.beginPath(); x.arc(0, 0, 18, 0, 7); x.fill();
  const t = new T.CanvasTexture(cv); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 8; return t;
}

function wheel(c, liv) {
  const g = new T.Group();
  const R = c.R, tw = c.tyreW;
  // pneumatika – lathe profil
  const prof = [];
  const rr = 0.045;
  const rimR = R * 0.64;
  prof.push(new T.Vector2(rimR, -tw / 2 + 0.01));
  for (let k = 0; k <= 8; k++) { const a = Math.PI + k * Math.PI / 16; prof.push(new T.Vector2(R - rr + rr * Math.cos(a + Math.PI / 2 * 0) * 0 + (R - rr - (R - rr)) , 0)); }
  prof.length = 1;
  for (let k = 0; k <= 8; k++) { const a = -Math.PI / 2 + k * Math.PI / 16; prof.push(new T.Vector2(R - rr + rr * Math.cos(a), -tw / 2 + rr + rr * Math.sin(a))); }
  for (let k = 0; k <= 8; k++) { const a = k * Math.PI / 16; prof.push(new T.Vector2(R - rr + rr * Math.cos(a), tw / 2 - rr + rr * Math.sin(a))); }
  prof.push(new T.Vector2(rimR, tw / 2 - 0.01));
  const tyre = new T.Mesh(new T.LatheGeometry(prof, 48), mat(0x1c1c1e, { roughness: 0.85, clearcoat: 0 }));
  tyre.material.side = T.DoubleSide;
  g.add(tyre);
  const rimM = new T.MeshPhysicalMaterial({ map: rimTexture(liv.rimStyle || c.rimStyle || 'multi', liv.rim || '#c9ccd1'), roughness: 0.35, metalness: 0.4, clearcoat: 0.6 });
  const disc = new T.Mesh(new T.CircleGeometry(rimR, 48), rimM);
  disc.rotation.x = -Math.PI / 2; disc.position.y = tw / 2 - 0.015;
  g.add(disc);
  const disc2 = disc.clone(); disc2.rotation.x = Math.PI / 2; disc2.position.y = -tw / 2 + 0.015; g.add(disc2);
  return g;  // osa = y
}

// ---------------------------------------------------------------- celé auto
function buildCar(c, liv) {
  normalize(c);
  const sh = makeShape(c);
  const grp = new T.Group();
  const tex = painter(c, sh, liv);
  const map = new T.CanvasTexture(tex.map); map.colorSpace = T.SRGBColorSpace; map.anisotropy = 16;
  const rough = new T.CanvasTexture(tex.rough);
  const bodyMat = new T.MeshPhysicalMaterial({ map, roughnessMap: rough, roughness: 1, metalness: liv.metal ? 0.35 : 0.05, clearcoat: 0.8, clearcoatRoughness: 0.12 });
  const body = new T.Mesh(bodyGeometry(sh, c), bodyMat);
  body.castShadow = true; body.receiveShadow = true;
  grp.add(body);
  // výplň podvozku (aby podběhy nebyly průhledné)
  const ch = new T.Mesh(new T.BoxGeometry(c.L * 0.86, sh.bMax * 0.55, c.W - 2 * (c.tyreW + 0.09)), mat(0x141416, { roughness: 0.9, clearcoat: 0 }));
  ch.position.set(0, c.gc + sh.bMax * 0.27, 0); grp.add(ch);
  // kola
  for (const ax of [c.axF, c.axR]) for (const sg of [1, -1]) {
    const wv = wheel(c, liv);
    wv.rotation.x = Math.PI / 2;
    wv.position.set(sh.X(ax), c.R, sg * (c.track / 2));
    wv.traverse(o => { if (o.isMesh) o.castShadow = true; });
    grp.add(wv);
  }
  const dark = mat(0x1d1e21, { roughness: 0.6, clearcoat: 0.2 });
  const chrome = mat(0xd8dade, { roughness: 0.12, metalness: 1, clearcoat: 1 });
  const bodyCol = mat(liv.bumper || liv.body, { roughness: 0.35, clearcoat: 0.8 });
  const bm = m => m === 'chrome' ? chrome : m === 'body' ? bodyCol : m === 'dark' ? dark : mat(m, { roughness: 0.4, clearcoat: 0.6 });
  // nárazníky
  for (const b of c.bumpers || []) grp.add(outlineStrip(sh, b.s, b.z0, b.z1, b.off || 0.04, bm(liv.bumperMat || b.m), b.rear, b.depth || 0.05));
  // světla
  for (const l of c.lights || []) lamp(grp, sh, l, false);
  for (const l of c.tail || []) lamp(grp, sh, l, true);
  // maska chladiče
  if (c.grille) for (const gr of c.grille) {
    grp.add(faceStrip(sh, false, gr.y - gr.w / 2, gr.y + gr.w / 2, gr.z - gr.h / 2, gr.z + gr.h / 2, gr.chrome ? 0.014 : 0.01, gr.chrome ? chrome : dark, gr.r || 0.015));
    if (gr.chrome) grp.add(faceStrip(sh, false, gr.y - gr.w / 2 + 0.02, gr.y + gr.w / 2 - 0.02, gr.z - gr.h / 2 + 0.02, gr.z + gr.h / 2 - 0.02, 0.018, dark, 0.01));
  }
  // zrcátka
  {
    const s = c.cab.mirror || (c.cab.cowl || c.cab.c0) + 0.025;
    const y = sh.width(s) + 0.07, z = sh.belt(s) + 0.07;
    for (const sg of [1, -1]) {
      const m = rbox(0.13, 0.085, 0.10, 0.03, liv.mirror === 'dark' ? dark : bodyCol);
      m.position.set(sh.X(s), z, sg * y); grp.add(m);
      const arm = new T.Mesh(new T.BoxGeometry(0.04, 0.03, 0.08), dark); arm.position.set(sh.X(s), z - 0.03, sg * (y - 0.07)); grp.add(arm);
    }
  }
  // křídlo / spoiler
  if (c.wing) {
    const w = c.wing, s = w.s;
    const z = sh.roof(s) + w.h;
    const span = sh.width(s) * 2 * w.span;
    const wingM = liv.wingCol ? mat(liv.wingCol, { roughness: 0.35, clearcoat: 0.8 }) : (w.mat === 'dark' ? dark : bodyCol);
    const plate = rbox(w.chord, 0.035, span, 0.015, wingM);
    plate.position.set(sh.X(s), z, 0); plate.rotation.z = w.tilt || 0.08; grp.add(plate);
    for (const sg of [1, -1]) {
      const p = new T.Mesh(new T.BoxGeometry(w.chord * 0.45, w.h, 0.025), wingM);
      p.position.set(sh.X(s) + 0.01, z - w.h / 2, sg * span * 0.36); grp.add(p);
    }
    if (w.lower) {   // druhé (spodní) křídlo Sierry Cosworth na víku
      const s2 = w.lower.s, z2 = sh.roof(s2) + 0.03;
      const lip = rbox(0.12, 0.03, sh.width(s2) * 1.9, 0.012, liv.wingCol ? mat(liv.wingCol, { roughness: 0.35 }) : bodyCol); lip.position.set(sh.X(s2), z2, 0); grp.add(lip);
    }
  }
  // kokpit kabrioletu: sedadla, čelní sklo, oblouk
  if (c.cab.open) {
    const cab = c.cab;
    const seatM = mat(0x3a3a3e, { roughness: 0.8, clearcoat: 0 });
    const zf = sh.belt((cab.c0 + cab.c1) / 2) - cab.tub;
    for (const sg of [1, -1]) {
      const back = rbox(0.12, 0.55, 0.44, 0.05, seatM);
      back.rotation.z = 0.25;
      back.position.set(sh.X(cab.seat), zf + 0.27, sg * 0.3); grp.add(back);
      const cush = rbox(0.42, 0.1, 0.44, 0.04, seatM); cush.rotation.y = Math.PI / 2; cush.rotation.y = 0;
      cush.position.set(sh.X(cab.seat) + 0.25, zf + 0.06, sg * 0.3); grp.add(cush);
    }
    // volant
    const sw = new T.Mesh(new T.TorusGeometry(0.17, 0.02, 10, 32), dark);
    sw.position.set(sh.X(cab.c0 + 0.06), sh.belt(cab.c0) + 0.02, 0.3); sw.rotation.set(0, Math.PI / 2, 0);
    grp.add(sw);
    // čelní sklo (rámeček + sklo)
    const s0 = cab.ws0, s1 = cab.ws1, h = cab.wsH;
    const zb = sh.belt(s0);
    const half = sh.width(s0) * 0.86;
    const qg = new T.BufferGeometry();
    const xa = sh.X(s0), xb = sh.X(s1);
    qg.setAttribute('position', new T.Float32BufferAttribute([xa, zb, half, xa, zb, -half, xb, zb + h, -half, xb, zb + h, half], 3));
    qg.setIndex([0, 1, 2, 0, 2, 3]); qg.computeVertexNormals();
    const gl = new T.Mesh(qg, new T.MeshPhysicalMaterial({ color: 0x223040, roughness: 0.05, metalness: 0.2, transparent: true, opacity: 0.55, clearcoat: 1, side: T.DoubleSide }));
    const ang = Math.atan2(h, (s1 - s0) * c.L);
    grp.add(gl);
    const fr = new T.Mesh(new T.BoxGeometry(0.035, 0.035, half * 2 + 0.02), dark);
    fr.position.set(sh.X(s1), zb + h, 0); grp.add(fr);
    for (const sg of [1, -1]) {
      const a = new T.Mesh(new T.BoxGeometry(Math.hypot((s1 - s0) * c.L, h), 0.035, 0.035), dark);
      a.rotation.z = -ang; a.position.set(sh.X(s0) - (s1 - s0) * c.L / 2, zb + h / 2, sg * half); grp.add(a);
    }
    if (liv.rollbar) {
      const rb = new T.Mesh(new T.TorusGeometry(0.42, 0.03, 10, 32, Math.PI), dark);
      rb.position.set(sh.X(cab.seat - 0.03), zf + 0.15, 0); rb.rotation.y = Math.PI / 2; rb.rotation.x = 0; grp.add(rb);
      rb.rotation.set(0, Math.PI / 2, 0);
    }
  }
  // rallye přídavná světla na kapotě / nárazníku
  if (liv.pod && liv.pod.lamps) {
    const hMat = mat(liv.pod.col || liv.body, { roughness: 0.35, clearcoat: 0.8 });
    const lens = mat(0xfffbe6, { emissive: 0xfff2c0, emissiveIntensity: 0.6, roughness: 0.08, clearcoat: 1 });
    for (const lp of liv.pod.lamps) {
      const fx = sh.X(lp.x / c.L);
      const house = new T.Mesh(new T.CylinderGeometry(lp.r + 0.028, lp.r + 0.035, 0.14, 32), hMat);
      house.rotation.z = Math.PI / 2; house.position.set(fx, lp.z, lp.y); grp.add(house);
      const ringM = new T.Mesh(new T.TorusGeometry(lp.r + 0.006, 0.012, 8, 32), chrome);
      ringM.rotation.y = Math.PI / 2; ringM.position.set(fx + 0.072, lp.z, lp.y); grp.add(ringM);
      const l = new T.Mesh(new T.CircleGeometry(lp.r, 32), lens);
      l.rotation.y = Math.PI / 2; l.position.set(fx + 0.071, lp.z, lp.y); grp.add(l);
    }
    if (liv.pod.bridge) { const b = liv.pod.bridge; const m = rbox(0.14, b.h, b.w, 0.03, hMat); m.position.set(sh.X(b.x / c.L), b.z, 0); grp.add(m); }
  } else if (liv.pod) {
    const s = liv.pod.s ?? 0.035;
    const n = liv.pod.n || 4;
    const zc = liv.pod.z ?? (sh.belt(s) + 0.09);
    const spacing = liv.pod.gap || 0.26;
    const podMat = mat(liv.pod.col || 0x111111, { roughness: 0.4 });
    const lens = mat(0xfffbe6, { emissive: 0xfff2c0, emissiveIntensity: 0.7, roughness: 0.1, clearcoat: 1 });
    const fx = sh.X(s) + 0.05;
    for (let i = 0; i < n; i++) {
      const y = (i - (n - 1) / 2) * spacing;
      const cyl = new T.Mesh(new T.CylinderGeometry(0.095, 0.085, 0.12, 28), podMat);
      cyl.rotation.z = Math.PI / 2; cyl.position.set(fx, zc, y); grp.add(cyl);
      const l = new T.Mesh(new T.CircleGeometry(0.083, 28), lens);
      l.rotation.y = Math.PI / 2; l.position.set(fx + 0.062, zc, y); grp.add(l);
    }
    const bar = new T.Mesh(new T.BoxGeometry(0.04, 0.03, spacing * (n - 1) + 0.1), podMat);
    bar.position.set(fx - 0.03, zc - 0.07, 0); grp.add(bar);
  }
  // lapače bláta
  if (liv.flaps) {
    const fm = mat(liv.flaps, { roughness: 0.7, clearcoat: 0 });
    for (const ax of [c.axF, c.axR]) for (const sg of [1, -1]) {
      const f = new T.Mesh(new T.BoxGeometry(0.012, 0.22, c.tyreW + 0.05), fm);
      f.position.set(sh.X(ax) - c.R - 0.09, 0.14, sg * c.track / 2); grp.add(f);
    }
  }
  grp.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return { grp, sh };
}

// ---------------------------------------------------------------- scéna a render
function envMap(renderer) {
  const sc = new T.Scene();
  const geo = new T.SphereGeometry(50, 32, 16);
  const cols = [];
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 50;
    const c = y > 0 ? new T.Color(0.80, 0.86, 0.95).lerp(new T.Color(1.0, 1.0, 1.0), y) : new T.Color(0.40, 0.40, 0.42).lerp(new T.Color(0.25, 0.25, 0.27), -y);
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
  sc.add(new T.Mesh(geo, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide })));
  const box = (w, h, x, y, z, k) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(k, k, k), side: T.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); sc.add(m); };
  box(30, 8, 0, 35, 0, 3.0);      // stropní softbox → odlesk na kapotě a střeše
  box(20, 10, 30, 12, 20, 1.8);
  box(20, 10, -25, 10, 25, 1.2);
  box(25, 6, 0, 8, -40, 1.0);
  const pm = new T.PMREMGenerator(renderer);
  return pm.fromScene(sc, 0.03).texture;
}

let renderer, env;
function render(c, liv, W, H, view) {
  if (!renderer) {
    renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
    renderer.outputColorSpace = T.SRGBColorSpace;
    env = envMap(renderer);
  }
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  const scene = new T.Scene();
  scene.environment = env;
  const { grp } = buildCar(c, liv);
  scene.add(grp);
  // podlaha se stínem
  const ground = new T.Mesh(new T.PlaneGeometry(40, 40), new T.ShadowMaterial({ opacity: 0.22 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  // měkký kontaktní stín
  const blobC = document.createElement('canvas'); blobC.width = blobC.height = 256;
  const bx = blobC.getContext('2d'); const gr = bx.createRadialGradient(128, 128, 10, 128, 128, 128);
  gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(0.55, 'rgba(0,0,0,0.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)');

      { name: 'POLEP · BÍLO-TYRKYSOVÝ', era: 'styl Gr. A 1990', body: W, rim: '#F4F4F4', rimStyle: 'star', flaps: '#0F8C8C', sun: { bg: '#0F8C8C', fg: '#fff' },
        paint(P) { swoosh(P, -0.1, 0.18, 0.6, '#0F8C8C'); swoosh(P, 0.18, 0.26, 0.6, '#123E8C'); tStripe(P, 0.0, 0.30, '#0F8C8C'); tStripe(P, 0.30, 0.45, '#123E8C'); num(P, 2, '#0F8C8C', 0.43, 0.80); P.sideText('RC-90', 0.66, 0.92, 0.16, '#0F8C8C', { italic: 1 }); roof(P, 2, '#0F8C8C', 0.62); } },
    ],
  };
  for (const c of CARS) if (X[c.id]) c.liveries.push(...X[c.id]);
})();

// ===== api.js
// ---------------------------------------------------------------- veřejné API (aplikace i web)
(() => {
  const LIVKEY = { f: 0, none: 0, '1': 1, '2': 2, '3': 3, '4': 4, stripes: 1, rally: 1, twotone: 1 };
  const WHEEL_COLORS = ['#C9CDD2', '#F6F6F6', '#D9B44A', '#4A4D52', '#1d1d1f'];
  const byId = id => CARS.find(c => c.id === id);
  function decode(style) {
    const p = String(style || '').split(';');
    return { model: p[0], liv: LIVKEY[p[1]] ?? 0, number: (p[3] || '').replace(/\D/g, '').slice(0, 3), wheel: p[4] || '', wcol: p[5] === undefined || p[5] === '' ? -1 : +p[5] };
  }
  function resolve(style, colorHex) {
    const d = decode(style);
    const car = byId(d.model);
    if (!car) return null;
    const base = car.liveries[Math.min(d.liv, car.liveries.length - 1)];
    const l = Object.assign({}, base);
    if (d.liv === 0 && colorHex) l.body = colorHex;
    if (d.wheel) l.rimStyle = d.wheel;
    if (d.wcol >= 0) l.rim = WHEEL_COLORS[d.wcol] || l.rim;
    if (d.number) l.numberOverride = d.number;
    return { car, l };
  }
  const VIEWS = {
    preview: () => ({}),
    top: () => ({ ortho: 5.2, top: 1 }),
  };
  /** Vykreslí auto podle stylu, vrátí PNG data-URL (nebo null, když model neexistuje). */
  RC90.renderStyle = (style, colorHex, view, w, h) => {
    const r = resolve(style, colorHex);
    if (!r) return null;
    return RC90.render(r.car, r.l, w, h, (VIEWS[view] || VIEWS.preview)());
  };
  RC90.has = model => !!byId(model);
  RC90.WHEEL_COLORS = WHEEL_COLORS;
})();

} catch (e) { console.warn("RC90 3D", e); }

  set(k, v) { mem[k] = v; try { localStorage.setItem("rc90_" + k, JSON.stringify(v)); } catch (e) {} },

function normalizeName(raw) {
  const a = raw.trim().toLowerCase().normalize("NFD").replace(/\p{M}+/gu, "").replace(/\s+/g, ".");
  const ok = /^[a-z0-9][a-z0-9._-]{1,23}$/.test(a);

}

function hms(ms, cs = false) {
  ms = Math.max(0, ms | 0);
  const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;

async function api(path, { method = "GET", body, auth = true, headers = {} } = {}) {

  let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) {}

function authMessage(status, d) {

function decodeTrack(s, startMs) {
  if (!s) return [];
  return s.split(";").map((it) => {
    const c = it.split(",");
    if (c.length < 5) return null;
    return { lat: +c[0], lon: +c[1], kmh: +c[2], ms: +c[3], sec: +c[4], t: startMs + +c[3] };
  }).filter(Boolean);
}

// ---------------------------------------------------------------------------
// Mapové podklady: přepínač vpravo nahoře, volba se pamatuje.
// Když vybraný podklad nejde načíst (některé servery odmítají stránky otevřené ze souboru),
// přepne se automaticky na jiný.
// ---------------------------------------------------------------------------
function baseLayers() {
  const osm = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  const esri = (svc, maxNative) => L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/" + svc + "/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19, maxNativeZoom: maxNative, attribution: "Podklad &copy; Esri" });
  const layers = {
    "Ulice": esri("World_Street_Map", 19),
    "Satelit": esri("World_Imagery", 19),
    "Tmavá": esri("Canvas/World_Dark_Gray_Base", 16),
  };
  // OpenStreetMap blokuje stránky otevřené ze souboru („Access blocked“) – nabízí se jen na webové adrese
  if (location.protocol !== "file:") {
    return { "Mapa": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: osm }), ...layers };
  }
  return layers;
}
function createMap(elId) {
  const m = L.map(elId, { zoomControl: true, attributionControl: true });
  const layers = baseLayers();
  const order = Object.keys(layers);
  let current = store.get("base");
  if (!layers[current]) current = order[0];
  layers[current].addTo(m);
  L.control.layers(layers, null, { position: "topright", collapsed: false }).addTo(m);
  m.on("baselayerchange", (e) => store.set("base", e.name));
  // když podklad vůbec nejde načíst, přepne se na další
  const loaded = {}, errors = {};
  order.forEach((name) => {
    const l = layers[name];
    l.on("tileload", () => { loaded[name] = (loaded[name] || 0) + 1; });
    l.on("tileerror", () => {
      errors[name] = (errors[name] || 0) + 1;
      if (errors[name] >= 4 && !loaded[name] && m.hasLayer(l)) {
        const next = order[(order.indexOf(name) + 1) % order.length];
        m.removeLayer(l); layers[next].addTo(m);
      }
    });
  });
  return m;
}

function drawMap(pts) {
  map = createMap("map");
  if (pts.length < 2) { map.setView([49.8, 15.5], 7); return; }
  const ll = pts.map((p) => [p.lat, p.lon]);
  L.polyline(ll, { color: "#000", weight: 7, opacity: .7 }).addTo(map);
  const line = L.polyline(ll, { color: "#ffb020", weight: 4 }).addTo(map);
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].sec !== pts[i - 1].sec) {
      L.circleMarker([pts[i].lat, pts[i].lon], { radius: 6, color: "#000", weight: 2, fillColor: "#f4f4ec", fillOpacity: 1 })
        .bindTooltip("Úsek " + pts[i].sec + " · " + hms(pts[i].ms)).addTo(map);
    }
  }
  L.circleMarker(ll[0], { radius: 8, color: "#000", weight: 2, fillColor: "#39d46e", fillOpacity: 1 }).bindTooltip("Start").addTo(map);
  L.circleMarker(ll[ll.length - 1], { radius: 8, color: "#000", weight: 2, fillColor: "#ff3b30", fillOpacity: 1 }).bindTooltip("Cíl").addTo(map);
  map.fitBounds(line.getBounds(), { padding: [24, 24] });
}

    if (!Object.keys(profiles).length) await loadProfiles();
    const list = ids.map((i) => '"' + i.replace(/"/g, "") + '"').join(",");
    rows = await api("/rest/v1/rallies?select=id,user_id,name,start_at,total_ms,distance_m,track&order=start_at.asc&id=in.(" + encodeURIComponent(list) + ")");
  } catch (e) { return showError(e); }
  rows = rows || [];
  app.innerHTML = `
  <div class="toolbar">
    <button id="back">← Zpět na seznam</button>
    <span class="lbl" style="margin-left:8px">${rows.length} ${rows.length === 1 ? "jízda" : rows.length < 5 ? "jízdy" : "jízd"} v mapě</span>
    <span style="flex:1"></span>
    <button id="fitAll">Ukázat vše</button>
  </div>
  <div class="multi">
    <div class="box"><div class="in" style="padding:0"><div id="mmap"></div></div></div>
    <div class="box"><div class="in legend" id="legend"></div></div>
  </div>`;
  $("#back").onclick = () => { location.hash = ""; };
  map = createMap("mmap");
  const groups = [];
  const bounds = L.latLngBounds([]);
  rows.forEach((r, i) => {
    const color = COLORS[i % COLORS.length];
    const pts = decodeTrack(r.track, new Date(r.start_at).getTime());
    const g = L.layerGroup();
    if (pts.length >= 2) {
      const ll = pts.map((p) => [p.lat, p.lon]);
      L.polyline(ll, { color: "#000", weight: 7, opacity: .6 }).addTo(g);
      const line = L.polyline(ll, { color, weight: 4 })
        .bindTooltip(esc(r.name) + " · " + esc(nameOf(r.user_id)) + " · " + esc(dt(r.start_at)), { sticky: true }).addTo(g);
      L.circleMarker(ll[0], { radius: 7, color: "#000", weight: 2, fillColor: color, fillOpacity: 1 }).bindTooltip("Start: " + esc(r.name)).addTo(g);
      g.bounds = line.getBounds();
      bounds.extend(g.bounds);
    }
    g.addTo(map);
    groups.push({ r, g, color, has: pts.length >= 2 });
  });
  $("#legend").innerHTML = groups.map((x, i) => `
    <div class="leg" data-i="${i}">
      <input type="checkbox" checked data-toggle="${i}">
      <span class="sw" style="background:${x.color}"></span>
      <span class="t">${esc(x.r.name)}<small>${esc(nameOf(x.r.user_id))} · ${esc(dt(x.r.start_at))} · ${km(x.r.distance_m)} km · ${hms(x.r.total_ms)}${x.has ? "" : " · bez trasy"}</small></span>
    </div>`).join("") || `<div class="hint">Žádná z vybraných jízd nemá trasu.</div>`;
  app.querySelectorAll("[data-toggle]").forEach((cb) => cb.onchange = () => {
    const x = groups[+cb.dataset.toggle];
    if (cb.checked) x.g.addTo(map); else map.removeLayer(x.g);
  });
  app.querySelectorAll(".leg").forEach((el) => el.onclick = (e) => {
    if (e.target.matches("input")) return;
    const x = groups[+el.dataset.i];
    if (x.g.bounds) map.fitBounds(x.g.bounds, { padding: [30, 30] });
  });
  const fitAll = () => { if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] }); else map.setView([49.8, 15.5], 7); };
  $("#fitAll").onclick = fitAll;
  fitAll();
}

// ---------------------------------------------------------------------------
// Živá mapa týmu (obnovuje se každých 5 s)
// ---------------------------------------------------------------------------
const FRESH_MS = 60000, MAX_AGE_MS = 30 * 60000;
function ageText(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 8) return "teď";
  if (s < 60) return s + " s";
  if (s < 3600) return Math.floor(s / 60) + " min";
  return Math.floor(s / 3600) + " h";
}
async function renderLive() {
  app.innerHTML = `
  <div class="toolbar">
    <button id="back">← Zpět na seznam</button>
    <span class="lbl" style="margin-left:8px">Živá mapa týmu</span>
    <span class="muted" id="liveInfo"></span>
    <span style="flex:1"></span>
    <button id="fitAll">Ukázat všechny</button>
  </div>
  <div class="multi">
    <div class="box"><div class="in" style="padding:0"><div id="mmap"></div></div></div>
    <div class="box"><div class="in legend" id="legend"><div class="hint">Načítám…</div></div></div>
  </div>`;
  $("#back").onclick = () => { location.hash = ""; };
  map = createMap("mmap");
  map.setView([49.8, 15.5], 7);
  const layer = L.layerGroup().addTo(map);
  let fitted = false, lastPts = [];
  const fitAll = () => {
    const fresh = lastPts.length ? lastPts : [];
    if (fresh.length === 1) map.setView(fresh[0], 14);
    else if (fresh.length > 1) map.fitBounds(L.latLngBounds(fresh), { padding: [40, 40], maxZoom: 15 });
  };
  $("#fitAll").onclick = fitAll;
  async function tick() {
    let rows;
    try {
      if (!Object.keys(profiles).length) await loadProfiles();
      const since = new Date(Date.now() - MAX_AGE_MS).toISOString();
      rows = await api("/rest/v1/live_positions?select=*&updated_at=gt." + encodeURIComponent(since));
    } catch (e) {
      const info = $("#liveInfo");
      if (info) info.textContent = e.status === 404 ? " · chybí tabulka (spusť rc90_live.sql)" : " · bez spojení";
      return;
    }
    if (!map) return;
    const now = Date.now();
    layer.clearLayers();
    lastPts = [];
    const list = (rows || []).map((r) => ({ ...r, age: now - new Date(r.updated_at).getTime(), name: nameOf(r.user_id) }))
      .sort((a, b) => a.age - b.age);
    for (const r of list) {
      const fresh = r.age < FRESH_MS;
      const color = fresh ? colorOf(r.user_id) : "#777";
      const speed = r.speed_kmh != null ? Math.round(r.speed_kmh) + " km/h" : "";
      const tip = `<b>${esc(r.name)}</b> ${esc(speed)}${r.car_name ? " · " + esc(r.car_name) : ""}${fresh ? "" : " · " + ageText(r.age)}`;
      if (r.car_body) {
        const size = 60, box = Math.ceil(size * 1.1) + 4;
        const html = `<div class="halo" style="background:${color}"></div>` + carTop(r.car_body, r.car_color || "#c8102e", size, r.heading || 0, !fresh);
        L.marker([r.lat, r.lon], { icon: L.divIcon({ className: "carmk", html, iconSize: [box, box], iconAnchor: [box / 2, box / 2] }) })
          .bindTooltip(tip, { permanent: true, direction: "right", offset: [box / 2 + 4, 0] })
          .addTo(layer);
      } else {
        L.circleMarker([r.lat, r.lon], { radius: 10, color: "#000", weight: 3, fillColor: color, fillOpacity: 1 })
          .bindTooltip(tip, { permanent: true, direction: "right", offset: [12, 0] })
          .addTo(layer);
      }
      if (fresh) lastPts.push([r.lat, r.lon]);
    }
    if (!lastPts.length) lastPts = list.map((r) => [r.lat, r.lon]);
    $("#liveInfo").textContent = " · " + list.filter((r) => r.age < FRESH_MS).length + " online · obnoveno " + new Date().toLocaleTimeString("cs-CZ");
    $("#legend").innerHTML = list.map((r) => `
      <div class="leg" data-lat="${r.lat}" data-lon="${r.lon}">
        <span></span>
        <span class="sw" style="background:${r.age < FRESH_MS ? colorOf(r.user_id) : "#777"}"></span>
        <span class="t">${esc(r.name)}${r.car_name ? " · " + esc(r.car_name) : ""}<small>${r.speed_kmh != null ? Math.round(r.speed_kmh) + " km/h · " : ""}${r.rally_active && r.section ? "rally úsek " + r.section + " · " : ""}${ageText(r.age)}</small></span>
      </div>`).join("") || `<div class="hint">Nikdo teď nesdílí polohu. Sdílení se zapíná v aplikaci na obrazovce TÝM.</div>`;
    app.querySelectorAll(".leg[data-lat]").forEach((el) => el.onclick = () => map.setView([+el.dataset.lat, +el.dataset.lon], 15));
    if (!fitted && lastPts.length) { fitted = true; fitAll(); }
  }
  await tick();
  liveTimer = setInterval(tick, 5000);
}

const fileBase = (r) => (r.name || "rally").normalize("NFD").replace(/\p{M}+/gu, "").replace(/[^A-Za-z0-9_-]+/g, "_").slice(0, 40);
function toGpx(r, pts) {
  const x = (s) => esc(s);
  let segs = "", cur = null;
  for (const p of pts) {
    if (p.sec !== cur) { if (cur !== null) segs += "    </trkseg>\n"; segs += "    <trkseg>\n"; cur = p.sec; }
    segs += `      <trkpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}"><time>${new Date(p.t).toISOString()}</time></trkpt>\n`;
  }
  if (cur !== null) segs += "    </trkseg>\n";
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="RC-90" xmlns="http://www.topografix.com/GPX/1/1">\n  <trk><name>${x(r.name)}</name>\n${segs}  </trk>\n</gpx>\n`;
}
function toCsv(pts) {
  return "timestamp,latitude,longitude,speed_kmh,elapsed_time,elapsed_ms,section\n" +
    pts.map((p) => [new Date(p.t).toISOString(), p.lat.toFixed(6), p.lon.toFixed(6), p.kmh.toFixed(1), hms(p.ms, true), p.ms, p.sec].join(",")).join("\n") + "\n";
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function showError(e) {
  if (e.message === "PŘIHLAS SE ZNOVU") { logout(); return; }
  app.innerHTML = `<div class="err" style="margin:30px 0">${esc(e.message === "Failed to fetch" ? "BEZ INTERNETU / ŠPATNÁ ADRESA PROJEKTU" : e.message)}</div><button onclick="location.reload()">Zkusit znovu</button>`;
}

$("#btnLogout").onclick = logout;
$("#btnProject").onclick = () => { if (map) { map.remove(); map = null; } renderProject(); };
window.addEventListener("hashchange", render);
render();
</script>
